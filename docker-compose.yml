services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: film_set
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d film_set"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FILM_SET_DB_HOST: postgres
      FILM_SET_DB_PORT: 5432
      FILM_SET_DB_NAME: film_set
      FILM_SET_DB_USER: postgres
      FILM_SET_DB_PASSWORD: postgres
      FILM_SET_LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
